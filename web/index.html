<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PVC wall and ceiling panels from Disenyo Interior Solution. Browse the range, order online, and arrange installation with PanelScan." />
    <meta name="theme-color" content="#f7f4ee" />
    <title>PanelScan | PVC Wall &amp; Ceiling Panels</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      // Saved light/dark choice (theme.ts), applied before the page paints.
      try {
        if (localStorage.getItem("panelscan.theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#171411");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
