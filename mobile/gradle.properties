# Project-wide Gradle settings.
# For more details on how to configure your build, see
# http://www.gradle.org/docs/current/userguide/build_gradle.html#sec:configuring_build_with_gradle_properties

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build, see
# http://www.gradle.org/docs/current/userguide/build_gradle.html#sec:configuring_build_with_gradle_properties

# Enable parallel compilation
org.gradle.parallel=true

# Enable caching
org.gradle.caching=true

# Increase memory for Gradle
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m

# AGP 9.0 compatibility
android.disallowKotlinSourceSets=false
android.newDsl=false
android.builtInKotlin=true
android.useAndroidX=true
android.enableJetifier=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
